# Build + logic harness on a real Mac for every push and pull request.
# Mirrors what a contributor runs locally: `swift build` (not Xcode, see
# CLAUDE.md), the --profile-test harness, the offscreen snapshot renders, and
# the .app assembly (ad-hoc signed; no secrets are used or needed).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      BUNDLE_ID: com.linas.parrot.assistant
      DISPLAY_NAME: Sakviro
      PARROT_NO_UPDATER: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Build (debug)
        run: swift build -c debug --force-resolved-versions

      # A fresh runner has none of Apple's on-demand NaturalLanguage assets;
      # a user's Mac fetches them the first time a language is used. The
      # embedding checks need the Latin-script model, so fetch it the same way.
      - name: Fetch NaturalLanguage embedding assets
        timeout-minutes: 6
        continue-on-error: true
        run: |
          cat > /tmp/nlassets.swift <<'SWIFT'
          import Foundation
          import NaturalLanguage
          let done = DispatchSemaphore(value: 0)
          for lang in [NLLanguage.english, .turkish] {
              guard let model = NLContextualEmbedding(language: lang) else { continue }
              if model.hasAvailableAssets { print("\(lang.rawValue): already present"); continue }
              model.requestAssets { result, error in
                  print("\(lang.rawValue): \(result.rawValue) \(error?.localizedDescription ?? "")")
                  done.signal()
              }
              _ = done.wait(timeout: .now() + 120)
          }
          SWIFT
          swift /tmp/nlassets.swift

      - name: Logic harness (--profile-test)
        run: |
          set +e
          .build/debug/Parrot --profile-test > harness.log 2>&1
          status=$?
          echo "--- failing checks ---"
          grep -E "^FAIL " harness.log || echo "(none)"
          echo "passed: $(grep -c '^PASS ' harness.log)  failed: $(grep -c '^FAIL ' harness.log)"
          tail -1 harness.log
          exit $status

      - name: Video mux and screen sampler
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          tests/video-mux/check.sh
          swiftc -parse-as-library Parrot/Services/ScreenContext.swift Parrot/Services/VideoCaptureService.swift tests/ScreenSamplerCheck.swift -o /tmp/screen-sampler-check
          /tmp/screen-sampler-check

      - name: Snapshot renders
        run: |
          mkdir -p snapshots
          .build/debug/Parrot --snapshot snapshots/report.png
          .build/debug/Parrot --copilot-snapshot snapshots/copilot.png
          .build/debug/Parrot --sidebar-snapshot snapshots/sidebar.png

      - name: Help screenshots (--help-shots)
        run: .build/debug/Parrot --help-shots snapshots/help

      # Small JPEG previews in the log, for reviewers who can't open artifacts.
      - name: Preview renders (base64 JPEG)
        if: always()
        run: |
          for f in snapshots/help/settings-connections.png snapshots/help/settings-privacy.png snapshots/help/ask.png snapshots/help/live-screen.png; do
            [ -f "$f" ] || continue
            sips -Z 460 -s format jpeg -s formatOptions 30 "$f" --out /tmp/preview.jpg >/dev/null
            echo "=== PREVIEW $f ==="
            base64 -i /tmp/preview.jpg | tr -d '\n'; echo
            echo "=== END ==="
          done

      - name: Assemble app bundle (ad-hoc)
        run: make bundle CONFIG=debug SIGN_IDENTITY=-

      # A downloadable, optimised build for trying a branch on a real Mac.
      # Ad-hoc signed (no secrets here): macOS needs the quarantine flag
      # cleared once — see docs/TESTING-GUIDE.md. ditto keeps the Sparkle
      # framework's symlinks, which a plain artifact zip would break.
      - name: Test build (release, ad-hoc)
        if: github.event_name != 'pull_request'
        run: |
          make bundle CONFIG=release SIGN_IDENTITY=- VERSION=0.29.9-sakviro2-ci
          ditto dist/Parrot.app "$RUNNER_TEMP/Sakviro.app"
          ditto -c -k --keepParent "$RUNNER_TEMP/Sakviro.app" Sakviro-test.zip
          test -s Sakviro-test.zip

      - name: Upload test build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: Sakviro-test-build
          path: Sakviro-test.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: |
            snapshots/
            harness.log
          if-no-files-found: ignore
